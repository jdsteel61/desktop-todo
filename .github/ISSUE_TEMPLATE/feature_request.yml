name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the way you work, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
      description: For example, which key or setting it would use.
